<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva Search Rebuild</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <aside class="sidebar">
        <h2>Elements</h2>
        <div class="search-wrapper">
            <div class="input-container">
                <input type="text" id="search-input" placeholder="Search elements...">
                <button id="clear-btn" class="hidden">X</button>
            </div>
        </div>
        <div id="status-container">
            <ul id="suggestions-list"></ul>
            <div id="loading-state" class="hidden">Searching...</div>
            <div id="empty-state" class="hidden">No results found.</div>
            <div id="error-state" class="hidden">Network error. Please try again.</div>

        </div>
    </aside>
    <script src="script.js"></script>
</body>

</html>
